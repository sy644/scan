<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1024">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>我的投资工具</title>
<style>
:root {
  --bg-1: #0a1024;
  --bg-2: #1a2540;
  --neon-cyan: #00f0ff;
  --neon-orange: #ff9500;
  --neon-pink: #ff3c8c;
  --neon-green: #00f5c8;
  --neon-yellow: #ffd000;
  --text-bright: #e0e8ff;
  --text-dim: #93A3BD;
  --card-bg: rgba(20, 26, 56, 0.7);
  --card-line: rgba(0, 240, 255, 0.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: var(--bg-1);
  color: var(--text-bright);
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,149,0,0.12) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,245,200,0.10) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(255,60,140,0.08) 0%, transparent 70%);
  z-index: 0;
  pointer-events: none;
}
/* 头部 */
.hero {
  position: relative;
  z-index: 1;
  padding: 50px 20px 20px;
  text-align: center;
}
.hero-title {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 3px;
  color: var(--neon-cyan);
  text-shadow: 0 0 16px rgba(0, 240, 255, 0.7), 0 0 32px rgba(0, 240, 255, 0.3);
  margin-bottom: 6px;
}
.hero-sub {
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 4px;
  text-transform: uppercase;
}
/* 时间 */
.clock {
  position: relative;
  z-index: 1;
  text-align: center;
  font-family: monospace;
  font-size: 11px;
  color: var(--neon-cyan);
  text-shadow: 0 0 6px rgba(0, 240, 255, 0.5);
  margin-bottom: 18px;
}
/* 卡片网格 */
.cards {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding: 0 16px;
  max-width: 720px;
  margin: 0 auto;
}
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 180px;
  padding: 20px 14px;
  border-radius: 24px;
  background: var(--card-bg);
  border: 2.5px solid var(--c1);
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  overflow: hidden;
  isolation: isolate;
  transition: transform 0.2s, box-shadow 0.2s;
}
/* 旋转彩边 */
.card::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  padding: 2px;
  background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c3), var(--c1));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: ringRotate 5s linear infinite;
  z-index: -1;
  filter: blur(0.4px);
}
@keyframes ringRotate { to { transform: rotate(360deg); } }
/* 内部柔光 */
.card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.card:active { transform: scale(0.97); }
.card.fund {
  --c1: #ff9500;
  --c2: #ffd000;
  --c3: #ff7ab0;
  box-shadow: 0 0 22px rgba(255, 149, 0, 0.45), inset 0 0 24px rgba(255, 149, 0, 0.12);
}
.card.stock {
  --c1: #00f5c8;
  --c2: #4dffe4;
  --c3: #88e8d8;
  box-shadow: 0 0 22px rgba(0, 245, 200, 0.45), inset 0 0 24px rgba(0, 245, 200, 0.12);
}
.card-icon {
  position: relative;
  z-index: 1;
  font-size: 44px;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 12px var(--c1));
}
.card-title {
  position: relative;
  z-index: 1;
  font-size: 18px;
  font-weight: 900;
  color: var(--c2);
  text-shadow: 0 0 12px var(--c1);
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.card-desc {
  position: relative;
  z-index: 1;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
  text-align: center;
  line-height: 1.4;
}
.card-hint {
  position: relative;
  z-index: 1;
  margin-top: 10px;
  font-size: 10px;
  color: var(--c1);
  letter-spacing: 1px;
  opacity: 0.85;
}
/* 提示 */
.footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 30px 20px;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 1px;
  opacity: 0.6;
}
</style>
</head>
<body>

<section class="hero">
  <h1 class="hero-title">📊 我的投资工具</h1>
  <div class="hero-sub">Investment Toolkit</div>
</section>

<div class="clock" id="clock"></div>

<div class="cards">
  <a class="card fund" href="https://sy644.github.io/fund-grid-private/" target="_blank" rel="noopener">
    <div class="card-icon">💰</div>
    <div class="card-title">基金加仓</div>
    <div class="card-desc">基金净值追踪<br>加仓档位 · 收益计算</div>
    <div class="card-hint">点击进入 →</div>
  </a>

  <a class="card stock" href="https://sy644.github.io/irain/kline/stock.html?code=sh600519" target="_blank" rel="noopener">
    <div class="card-icon">📈</div>
    <div class="card-title">自选股 K线</div>
    <div class="card-desc">实时行情 · 技术指标<br>MA · MACD · RSI · KDJ</div>
    <div class="card-hint">点击进入 →</div>
  </a>
</div>

<footer class="footer">
  点击卡片在新页面打开 · 返回浏览器历史可回此页
</footer>

<script>
function updateClock() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const week = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('clock').textContent =
    `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} 周${week} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
